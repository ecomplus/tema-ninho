<!--
  Wordmark placeholder da variante "Ninho" (bebê e infantil) — FONTE EDITÁVEL.
  A loja serve o PNG gerado daqui: o `Picture` do storefront passa a imagem
  pelo serviço de imagem do Astro, que rejeita `svg+xml`.

  Regerar após editar:
    cd .../public/img/uploads
    node /home/vitorrgg/demo-catalog/scripts/rasterize.mjs \
      /home/vitorrgg/store-ninho/functions/ssr \
      logo-ninho.svg logo-ninho.png 1200

  Ninho em traço redondo com um ovo dentro — terminação arredondada em tudo,
  que é o vocabulário do tema (raio 0.875rem, botão em pílula, sem caixa alta).
  Deliberadamente NÃO usa rosa nem azul-bebê: ver o porquê no README.

  Fontes são as instaladas no ambiente que rasteriza (DejaVu/Ubuntu).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Ninho">
  <!-- ovo -->
  <ellipse cx="34" cy="32" rx="8.5" ry="11" fill="#e9a08c" />
  <!-- ninho: duas curvas sobrepostas, traço redondo -->
  <g stroke="#5d8a6a" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M17 40c0 8 7.6 13 17 13s17-5 17-13" />
    <path d="M13 44c2 9 10.5 15 21 15s19-6 21-15" />
  </g>
  <!-- Linha de apoio em 10px e curta: a 8 ela virava borrão no tamanho real
       do header (`max-w-[210px]` encolhe a caixa de 300 para ~0,7×). -->
  <text x="70" y="41" font-family="Ubuntu Sans, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#2b2520" letter-spacing="0.5">Ninho</text>
  <text x="72" y="58" font-family="DejaVu Sans, system-ui, sans-serif" font-size="10" font-weight="600" fill="#776957" letter-spacing="1.8">ENXOVAL E PASSEIO</text>
</svg>
